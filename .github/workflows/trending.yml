name: refresh-trending

# Twice daily:
#   1. Scrape github.com/trending (Today/Week/Month)
#   2. Score each repo with the full real-stars algorithm
#   3. Commit + push trending.json + trending-scored.json
#   4. Deploy refreshed site/ to Cloudflare Pages
#
# Schedule rationale: GitHub's daily trending list refreshes once a day,
# community-tracked at ~10–11 AM UTC ("before 11 AM", drifts over time;
# GitHub doesn't officially document it — community/discussions/64295).
# The 11:30 AM UTC run lands ~30–90 min after that window so we scrape
# the FRESH daily list, not yesterday's. The 23:30 UTC run is a 12h
# follow-up that lets weekly/monthly verdicts and stale-algo re-scores
# (which hit the per-run API budget cap and need multiple passes) catch
# up without paying for 4 runs/day. :30 past the hour dodges the
# top-of-hour GitHub Actions scheduler congestion (cron is best-effort
# and frequently delayed several minutes under load).
#
# The user-score cache is persisted in Actions cache (not git) — keeps
# history slim while still amortizing API costs across runs.
#
# Required GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN  — Pages:Edit token (Cloudflare dashboard →
#                            My Profile → API Tokens → Create Token →
#                            "Edit Cloudflare Workers" template, or a
#                            custom token with Account.Cloudflare Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID — 6b67f38611a3643755e71b5b02d0ffcb (not secret,
#                            but stored as a secret for convenience)

on:
  schedule:
    # 11:30 UTC — ~30–90 min after GitHub's daily trending refresh.
    - cron: '30 11 * * *'
    # 23:30 UTC — 12h follow-up for weekly/monthly + stale-algo catch-up.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: restore user-score cache
        uses: actions/cache@v4
        with:
          path: scripts/.user-cache.json
          key: user-cache-${{ github.run_id }}
          restore-keys: |
            user-cache-

      - name: fetch trending (Today/Week/Month)
        run: node scripts/fetch-trending.mjs

      - name: score each trending repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/score-trending.mjs

      - name: commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git status --porcelain site/data/trending.json site/data/trending-scored.json)
          if [[ -n "$changed" ]]; then
            git add site/data/trending.json site/data/trending-scored.json
            git commit -m "data(trending): refresh $(date -u +%FT%TZ)"
            git push
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no changes to commit"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare Pages doesn't auto-deploy on git push for this project
      # (it's a CLI-based project, not Git-integration-based). Push the
      # static site directly via wrangler so the live site matches the repo.
      - name: deploy site to Cloudflare Pages
        if: steps.commit.outputs.deployed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=real-stars-hall-of-shame --commit-dirty=true --branch=main

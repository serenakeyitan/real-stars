<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>fake-org/fake-repo · GitHub</title>
  </head>
  <body>
    <header class="gh-header-actions">
      <h1>fake-org / fake-repo</h1>
      <ul class="pagehead-actions">
        <li>
          <button data-ga-click="Repository, click Watch">Watch</button>
        </li>
        <li>
          <form action="/fake-org/fake-repo/star">
            <button aria-label="Star this repository">
              <span>Star</span>
              <span>1.2k</span>
            </button>
          </form>
        </li>
        <li>
          <button data-ga-click="Repository, click Fork">Fork</button>
        </li>
      </ul>
    </header>
    <main>
      <p>This is a stand-in for a real GitHub repo page used by the E2E tests.</p>
      <p>The content script should inject a real-stars badge into the pagehead-actions list above.</p>
    </main>
  </body>
</html>

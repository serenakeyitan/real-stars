<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>real-stars — GitHub Trending, scored for bought stars</title>
    <meta
      name="description"
      content="Every repo on GitHub Trending, scored for bought stars by the real-stars algorithm. Updated every six hours."
    />
    <meta property="og:title" content="real-stars — GitHub Trending, scored" />
    <meta
      property="og:description"
      content="Every repo on GitHub Trending, scored for bought stars by the real-stars algorithm."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="/" class="brand">
          <img src="/favicon-32.png" alt="" width="20" height="20" />
          <span>real-stars</span>
        </a>
        <nav class="topnav">
          <a href="/" class="nav-link active">Trending</a>
          <a href="/registry.html" class="nav-link">Registry</a>
          <a href="https://github.com/serenakeyitan/real-stars" target="_blank" rel="noopener" class="nav-link">Extension</a>
        </nav>
      </div>
    </header>

    <main>
      <section id="trendingSection">
        <div class="container">
          <div class="page-head">
            <h1>Trending, scored</h1>
            <p class="page-sub">
              Every repo on
              <a href="https://github.com/trending" target="_blank" rel="noopener">github.com/trending</a>,
              scored for bought stars. Updated every six hours.
            </p>
          </div>
          <div class="trending-toolbar">
            <div class="tabs" id="trendingTabs">
              <button class="tab active" data-period="daily">Today</button>
              <button class="tab" data-period="weekly">This week</button>
              <button class="tab" data-period="monthly">This month</button>
            </div>
            <p class="freshness" id="leaderboardFreshness"></p>
          </div>
          <div id="trendingList" class="trending-list"></div>
          <p class="snapshot-warning" id="snapshotWarning"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          Algorithm
          <a href="https://github.com/serenakeyitan/real-stars" target="_blank" rel="noopener">open-source on GitHub</a>
          ·
          <a href="https://chromewebstore.google.com/detail/real-stars" target="_blank" rel="noopener">free Chrome extension</a>
          · trending list from
          <a href="https://github.com/trending" target="_blank" rel="noopener">github.com/trending</a>
        </p>
        <p class="footer-author">
          built by
          <a href="https://github.com/serenakeyitan" target="_blank" rel="noopener">@serenakeyitan</a>
          ·
          <a href="https://twitter.com/serenatan5" target="_blank" rel="noopener">@serenatan5</a>
        </p>
      </div>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
